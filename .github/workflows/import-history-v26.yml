name: Official history import v2.6
on:
  workflow_dispatch:
  push:
    branches: [upgrade-v2.6]
    paths:
      - '.github/workflows/import-history-v26.yml'
      - 'scripts/import_official_history.py'
permissions:
  contents: write
concurrency:
  group: official-history-v26
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/upgrade-v2.6'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/import_official_history.py
      - name: Commit validated history to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily539.json data/lotto649.json data/superlotto638.json data/history-import-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Import verified official annual lottery archives"
            git push origin HEAD:upgrade-v2.6
          fi
